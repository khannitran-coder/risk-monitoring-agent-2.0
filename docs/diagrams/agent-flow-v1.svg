<rect x="440" y="410" width="220" height="40" rx="8" fill="#fee2e2" stroke="#dc2626"/><text x="550.0" y="423.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#111">human_approval (đầy đủ)</text><text x="550.0" y="441.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555">interrupt() — PM duyệt</text>
