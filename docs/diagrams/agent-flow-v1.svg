<line x1="360" y1="85" x2="360" y2="125" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="360" y1="169" x2="360" y2="215" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="520" y="125" width="140" height="44" rx="8" fill="#ecfdf5" stroke="#059669"/><text x="590.0" y="140.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#111">fetch_slack</text><text x="590.0" y="158.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555">redact tại đây</text>
<line x1="360" y1="85" x2="590" y2="125" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="590" y1="169" x2="360" y2="215" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="240" y="215" width="240" height="48" rx="8" fill="#fef9c3" stroke="#ca8a04"/><text x="360.0" y="232.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#111">correlate_signals</text><text x="360.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555">rule: ≥2/3 nguồn mới gán risk_level</text>
<line x1="360" y1="263" x2="170" y2="320" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="360" y1="263" x2="550" y2="320" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="320" width="220" height="40" rx="8" fill="#f3f4f6" stroke="#6b7280"/><text x="170.0" y="333.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#111">draft_digest</text><text x="170.0" y="351.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555">LOW / MEDIUM</text>
<rect x="440" y="320" width="220" height="40" rx="8" fill="#f3f4f6" stroke="#6b7280"/><text x="550.0" y="333.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#111">draft_action_plan</text><text x="550.0" y="351.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555">HIGH / CRITICAL (schema PMBOK)</text>
