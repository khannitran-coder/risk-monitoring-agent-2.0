<rect x="440" y="540" width="220" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7"/><text x="550.0" y="559.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#111">escalate</text><text x="550.0" y="577.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555">Jira (idempotent) → Slack Ban giám đốc</text>
<line x1="170" y1="580" x2="300" y2="660" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="550" y1="592" x2="420" y2="660" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="240" y="660" width="240" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7"/><text x="360.0" y="673.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#111">cleanup_session</text><text x="360.0" y="691.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555">ghi audit log JSONL</text>
<path d="M60,430 C20,430 20,340 60,340" fill="none" stroke="#dc2626" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="12" y="395" font-size="10" fill="#dc2626" transform="rotate(-90 12 395)">edit (tối đa 3 lần)</text>
<path d="M660,430 C700,430 700,340 660,340" fill="none" stroke="#dc2626" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="708" y="395" font-size="10" fill="#dc2626" transform="rotate(90 708 395)">edit (tối đa 3 lần)</text>
<text x="360" y="735" text-anchor="middle" font-size="12" fill="#555">reject / quyết định không hợp lệ → cleanup_session (không gửi gì)</text>
<text x="360" y="755" text-anchor="middle" font-size="12" fill="#555">breaker bật → init_session đi thẳng tới cleanup_session (MANUAL_MODE)</text>
</svg>