<rect width="720" height="780" fill="#fff"/>
<text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold">Luồng v1.0 (rule-based, đã triển khai &amp; có test)</text>
<rect x="260" y="45" width="200" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7"/><text x="360.0" y="58.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#111">init_session</text><text x="360.0" y="76.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555">kiểm tra circuit breaker</text>
