[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprint-risk-agent"
version = "1.0.0"
description = "Sprint Risk Monitoring Agent — LangGraph, human-in-the-loop, rule-based risk correlation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0", "pydantic>=2.5"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/sprint_risk_agent/mcp_clients/fake.py" = ["E501"]
